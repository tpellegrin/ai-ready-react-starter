# Publishes the starter's live preview: an explicitly labelled DEMO build
# (demo auth signs in anyone; the API is MSW inside the browser). An adopted
# product deploys `pnpm build` with its real configuration instead — see
# docs/adoption.md and docs/configuration.md.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_PAGES: 'true'
      GITHUB_PAGES_REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm validate
      - name: Build demo (GitHub Pages base path)
        run: pnpm build:demo
      - name: Inspect the build (demo profile, base path)
        run: pnpm check:build:demo --base "/${GITHUB_PAGES_REPO}/"
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
