name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job is required; none is allowed to fail. See docs/guardrails.md.
jobs:
  validate:
    name: Validate (format, lint, styles, types, i18n, docs, architecture, tooling and unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm validate

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Runtime dependencies only; dev-tool advisories are triaged in SECURITY.md.
      - run: pnpm audit --prod --audit-level=high

  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:cov
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build and inspect artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI only verifies that a real build succeeds and passes its budgets.
      # Deployments provide their own API URL (see docs/configuration.md).
      VITE_API_BASE_URL: https://api.example.test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Check budgets, code splitting and forbidden content
        run: pnpm check:build
      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: |
            dist/
            reports/build/
          retention-days: 7
      # starter:demo-start
      - run: pnpm build:demo
      - name: Check the demo build
        run: pnpm check:build:demo
      # starter:demo-end

  storybook:
    name: Storybook (interaction and accessibility tests in Chromium and WebKit, static build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: pnpm test:storybook
      - run: pnpm storybook:build
      - name: Upload Storybook
        uses: actions/upload-artifact@v7
        with:
          name: storybook
          path: storybook-static/
          retention-days: 7

  e2e:
    name: End-to-end (built apps, mobile WebKit, dev Strict Mode, accessibility)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: pnpm test:e2e
      # Composition plans' reviewed baselines (design/<task>/baselines);
      # a missing one fails, nothing is written (docs/recipes/compose-from-images.md).
      - run: pnpm design:regress
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            reports/design/
          retention-days: 7

  generator:
    name: Generator check (temporary copy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm gen:check

  adoption:
    # Each scenario adopts a temporary copy and runs that project's own
    # pnpm verify (minus the adoption check, so verification never recurses).
    name: Adoption check (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [demo, reference, all, product]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: pnpm adopt:check --scenario ${{ matrix.scenario }}
