<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <!-- Hand-drawn wireframe of the add-expense dialog. Original work for this repository (MIT). -->
  <defs>
    <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" />
    </filter>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#2d2d2d" stroke-width="2.4" />
    </pattern>
  </defs>
  <rect width="1200" height="860" fill="#fbfaf6" />
  <g filter="url(#pencil)" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
     font-family="'Chalkboard SE', 'Comic Sans MS', cursive">

    <!-- The page behind, faint -->
    <g stroke="#c4c2bc">
      <path d="M30 26 L1170 24 L1171 122 L31 124 Z" />
      <text x="300" y="196" font-size="42" fill="#c4c2bc" stroke="none">Expenses</text>
      <rect x="300" y="262" width="190" height="90" rx="12" />
      <rect x="505" y="262" width="190" height="90" rx="12" />
      <rect x="710" y="262" width="190" height="90" rx="12" />
      <rect x="300" y="462" width="600" height="72" rx="12" />
      <rect x="300" y="548" width="600" height="72" rx="12" />
      <rect x="300" y="634" width="600" height="72" rx="12" />
    </g>
    <path d="M0 0 H1200 V860 H0 Z" fill="#2f2f2f" fill-opacity="0.12" stroke="none" />

    <!-- Dialog -->
    <g stroke="#2f2f2f">
      <path d="M380 172 L822 168 L826 690 L384 694 Z" fill="#fbfaf6" />
      <text x="410" y="224" font-size="27" fill="#2f2f2f" stroke="none">Add expense</text>
      <text x="784" y="216" font-size="24" fill="#2f2f2f" stroke="none">×</text>

      <text x="410" y="272" font-size="16" fill="#2f2f2f" stroke="none">Description</text>
      <rect x="410" y="282" width="380" height="40" rx="6" stroke="#b3261e" />
      <text x="410" y="344" font-size="15" fill="#b3261e" stroke="none">Enter a description</text>

      <text x="410" y="384" font-size="16" fill="#2f2f2f" stroke="none">Amount</text>
      <rect x="410" y="394" width="380" height="40" rx="6" stroke="#b3261e" />
      <text x="424" y="420" font-size="16" fill="#999" stroke="none">$</text>
      <text x="410" y="456" font-size="15" fill="#b3261e" stroke="none">Enter an amount</text>

      <text x="410" y="496" font-size="16" fill="#2f2f2f" stroke="none">Category</text>
      <rect x="410" y="506" width="380" height="40" rx="6" />
      <text x="424" y="532" font-size="16" fill="#2f2f2f" stroke="none">Meals</text>
      <path d="M764 520 L771 529 L778 520" />

      <rect x="556" y="610" width="110" height="44" rx="10" />
      <text x="580" y="638" font-size="17" fill="#2f2f2f" stroke="none">Cancel</text>
      <rect x="680" y="610" width="122" height="44" rx="10" fill="url(#hatch)" />
      <rect x="690" y="620" width="102" height="24" rx="4" fill="#fbfaf6" stroke="none" />
      <text x="698" y="638" font-size="17" fill="#2f2f2f" stroke="none">Save</text>
    </g>

    <!-- Annotations (red pen) -->
    <g font-family="'Bradley Hand', 'Chalkboard SE', cursive" stroke="#b3261e">
      <path d="M838 330 C 870 320, 900 310, 930 296" />
      <path d="M838 330 L852 322 M838 330 L852 336" />
      <text x="936" y="290" font-size="19" fill="#b3261e" stroke="none">errors show under</text>
      <text x="936" y="316" font-size="19" fill="#b3261e" stroke="none">each field after Save</text>
      <text x="936" y="380" font-size="19" fill="#b3261e" stroke="none">category defaults</text>
      <text x="936" y="406" font-size="19" fill="#b3261e" stroke="none">to Meals</text>
      <path d="M930 396 C 890 420, 840 470, 796 516" />
    </g>

    <text x="30" y="836" font-size="14" fill="#888" stroke="none">add expense · after pressing Save with nothing filled in</text>
  </g>
</svg>
