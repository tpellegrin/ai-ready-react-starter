<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <!-- Hand-drawn wireframe of an expenses page. Original work for this repository (MIT). -->
  <defs>
    <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" />
    </filter>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#2d2d2d" stroke-width="2.4" />
    </pattern>
  </defs>
  <rect width="1200" height="860" fill="#fbfaf6" />
  <g filter="url(#pencil)" fill="none" stroke="#2f2f2f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
     font-family="'Chalkboard SE', 'Comic Sans MS', cursive" fill-rule="evenodd">

    <!-- App header -->
    <path d="M30 26 L1170 24 L1171 122 L31 124 Z" />
    <text x="58" y="66" font-size="23" font-weight="bold" fill="#2f2f2f" stroke="none">LEDGERLY</text>
    <rect x="1036" y="38" width="108" height="36" rx="18" />
    <text x="1054" y="62" font-size="16" fill="#2f2f2f" stroke="none">Sign out</text>
    <text x="58" y="106" font-size="17" fill="#2f2f2f" stroke="none">Dashboard</text>
    <text x="176" y="106" font-size="17" fill="#2f2f2f" stroke="none">Expenses</text>
    <path d="M175 112 L254 111" />
    <rect x="1030" y="88" width="114" height="26" rx="6" />
    <text x="1040" y="107" font-size="15" fill="#2f2f2f" stroke="none">English ▾</text>

    <!-- Title row -->
    <text x="300" y="196" font-size="42" fill="#2f2f2f" stroke="none">Expenses</text>
    <rect x="718" y="160" width="182" height="48" rx="10" fill="url(#hatch)" />
    <rect x="732" y="171" width="154" height="26" rx="4" fill="#fbfaf6" stroke="none" />
    <text x="744" y="191" font-size="18" fill="#2f2f2f" stroke="none">+ Add expense</text>
    <text x="300" y="236" font-size="17" fill="#2f2f2f" stroke="none">Track and approve what the team spends.</text>

    <!-- Summary tiles -->
    <rect x="300" y="262" width="190" height="90" rx="12" />
    <text x="318" y="290" font-size="14" fill="#555" stroke="none">TOTAL</text>
    <text x="318" y="330" font-size="27" fill="#2f2f2f" stroke="none">$1,234.50</text>
    <rect x="505" y="262" width="190" height="90" rx="12" />
    <text x="523" y="290" font-size="14" fill="#555" stroke="none">PENDING</text>
    <text x="523" y="330" font-size="27" fill="#2f2f2f" stroke="none">1</text>
    <rect x="710" y="262" width="190" height="90" rx="12" />
    <text x="728" y="290" font-size="14" fill="#555" stroke="none">APPROVED</text>
    <text x="728" y="330" font-size="27" fill="#2f2f2f" stroke="none">2</text>

    <!-- Filter -->
    <text x="300" y="394" font-size="16" fill="#2f2f2f" stroke="none">Status</text>
    <rect x="300" y="404" width="180" height="36" rx="6" />
    <text x="314" y="428" font-size="16" fill="#2f2f2f" stroke="none">All</text>
    <path d="M455 418 L462 427 L469 418" />

    <!-- Expense rows -->
    <rect x="300" y="462" width="600" height="72" rx="12" />
    <text x="320" y="492" font-size="20" fill="#2f2f2f" stroke="none">Team lunch</text>
    <text x="320" y="518" font-size="14" fill="#555" stroke="none">Meals · 12 Mar 2026</text>
    <text x="790" y="494" font-size="20" fill="#2f2f2f" stroke="none">$86.40</text>
    <rect x="794" y="503" width="86" height="23" rx="11" />
    <text x="806" y="520" font-size="13" fill="#2f2f2f" stroke="none">Pending</text>

    <rect x="300" y="548" width="600" height="72" rx="12" />
    <text x="320" y="578" font-size="20" fill="#2f2f2f" stroke="none">Train to Lyon</text>
    <text x="320" y="604" font-size="14" fill="#555" stroke="none">Travel · 10 Mar 2026</text>
    <text x="782" y="580" font-size="20" fill="#2f2f2f" stroke="none">$142.10</text>
    <rect x="794" y="589" width="86" height="23" rx="11" />
    <text x="802" y="606" font-size="13" fill="#2f2f2f" stroke="none">Approved</text>

    <rect x="300" y="634" width="600" height="72" rx="12" />
    <text x="320" y="664" font-size="20" fill="#2f2f2f" stroke="none">Design tool licence</text>
    <text x="320" y="690" font-size="14" fill="#555" stroke="none">Software · 3 Mar 2026</text>
    <text x="764" y="666" font-size="20" fill="#2f2f2f" stroke="none">$1,006.00</text>
    <rect x="794" y="675" width="86" height="23" rx="11" />
    <text x="802" y="692" font-size="13" fill="#2f2f2f" stroke="none">Approved</text>

    <!-- Annotations -->
    <g font-family="'Bradley Hand', 'Chalkboard SE', cursive" stroke="#2f2f2f">
      <path d="M902 178 C 940 160, 960 150, 990 150" />
      <path d="M902 178 L914 168 M902 178 L916 182" />
      <text x="996" y="156" font-size="20" fill="#2f2f2f" stroke="none">opens a dialog</text>

      <path d="M40 560 L262 556 L266 690 L44 694 Z" stroke-dasharray="6 6" />
      <text x="56" y="588" font-size="17" fill="#2f2f2f" stroke="none">if there are none:</text>
      <text x="56" y="616" font-size="17" fill="#2f2f2f" stroke="none">"No expenses yet"</text>
      <rect x="56" y="632" width="150" height="34" rx="8" />
      <text x="70" y="655" font-size="16" fill="#2f2f2f" stroke="none">+ Add expense</text>
      <path d="M266 620 C 280 600, 285 560, 296 540" />
      <path d="M296 540 L284 548 M296 540 L298 554" />

      <g transform="rotate(-4 1040 480)">
        <path d="M936 420 L1150 416 L1154 548 L940 552 Z" fill="#f4efd6" />
        <text x="952" y="452" font-size="18" fill="#2f2f2f" stroke="none">note to dev:</text>
        <text x="952" y="480" font-size="18" fill="#2f2f2f" stroke="none">just hardcode the</text>
        <text x="952" y="508" font-size="18" fill="#2f2f2f" stroke="none">totals for now :)</text>
      </g>
    </g>

    <text x="30" y="836" font-size="14" fill="#888" stroke="none">expenses page · sketch v1 · desktop</text>
  </g>
</svg>
